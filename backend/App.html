  $("#navigation").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
  const pins=["dashboard","tasks","farms","inventory","more"];
  $("#bottom-nav").innerHTML=pins.map(k=>k==="more"?'<button data-more><b>•••</b>More</button>':'<button class="'+(state.view===k?"active":"")+'" data-view="'+k+'"><b>'+title(k).icon+'</b>'+esc(title(k).label)+'</button>').join("");
  $("#bottom-nav").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
  const more=$("#bottom-nav [data-more]");if(more)more.onclick=()=>$("#sidebar").classList.toggle("open");
 }
 function go(key){state.view=key;state.search="";$("#sidebar").classList.remove("open");renderNav();if(key==="dashboard")loadDashboard();else loadModule(key);}
 function setHeader(){const m=title(state.view);$("#page-title").textContent=m.label;$("#farm-picker").innerHTML='<option value="">'+t("allFarms")+'</option>'+(state.bootstrap.farms||[]).map(f=>'<option value="'+esc(f.farm_id)+'">'+esc(f.farm_name)+'</option>').join("");$("#farm-picker").value=state.farmId;}
 function init(){
  $("#content").innerHTML='<div class="loading">Preparing configurable database and loading FarmERP…</div>';
  $("#menu-toggle").onclick=()=>$("#sidebar").classList.toggle("open");
  $("#refresh").onclick=()=>state.view==="dashboard"?loadDashboard():loadModule(state.view);
  $("#farm-picker").onchange=e=>{state.farmId=e.target.value;state.view==="dashboard"?loadDashboard():loadModule(state.view);};
  $("#language-picker").onchange=e=>{state.language=e.target.value;renderNav();state.view==="dashboard"?loadDashboard():loadModule(state.view);};
  call("erpBootstrap").then(data=>{state.bootstrap=data;return call("erpGetSchema");}).then(schema=>{state.schema=schema;setHeader();renderNav();loadDashboard();})
   .catch(e=>{$("#content").innerHTML='<div class="error"><strong>FarmERP could not initialise</strong><p>'+esc(e.message)+'</p><p>Verify that the Apps Script project is connected to its development spreadsheet and that the current source contains the FarmERP services.</p></div>';});
 }
 function metric(label,value,sub,icon){return '<article class="metric"><div class="metric-top"><span>'+esc(label)+'</span><b class="metric-icon">'+icon+'</b></div><strong>'+esc(value??"—")+'</strong><small>'+esc(sub)+'</small></article>';}
 function listSection(titleText,rows,keyField,fields){
  return '<article class="panel"><div class="panel-head"><div><h3>'+esc(titleText)+'</h3><p>Latest records from the connected database</p></div></div>'+(rows&&rows.length?rows.map(r=>'<div class="dash-row"><strong>'+esc(r[fields[0]]||"Record")+'</strong><span>'+esc(r[fields[1]]||"")+'</span></div>').join(""):'<div class="empty"><div class="empty-icon">▦</div><strong>No records yet</strong><span>Records will appear here as the farm team uses the application.</span></div>')+'</article>';
 }
 function loadDashboard(){
  $("#content").innerHTML='<div class="loading">Loading operational dashboard…</div>';
  call("erpGetDashboard",state.farmId).then(data=>{
   const m=data.metrics;
   $("#content").innerHTML='<div class="welcome"><div><h2>Today’s farm operations</h2><p>Actionable priorities and farm-wide exceptions, separated from forecasts and planned work.</p></div><div class="actions"><button class="btn secondary" data-view="reports">Reports</button><button class="btn primary" data-view="tasks">＋ '+t("new")+'</button></div></div><div class="metric-grid">'+
    metric("Open tasks",m.openTasks,"Assigned / in progress","☷")+metric("Due today",m.dueToday,"Tasks due today","◷")+metric("Overdue",m.overdue,"Requires attention","!")+metric("Action required",m.actionRequired,"Scouting observations","◎")+metric("Active crop cycles",m.activeCropCycles,"Current production","♧")+metric("Open orders",m.openOrders,"Awaiting fulfilment","◈")+metric("Low stock items",m.lowStockItems,"At or below reorder level","▤")+'</div><div class="dash-grid"><div class="span-2">'+listSection("Due today",data.dueTasks,"task_id",["title","status"])+'</div>'+listSection("Overdue work",data.overdueTasks,"task_id",["title","due_at"])+listSection("Crop and field alerts",data.actionObservations,"observation_id",["category","description"])+listSection("Low stock",data.lowStock.map(x=>({name:x.item.item_name,balance:x.balance})), "item_id",["name","balance"])+listSection("Open sales orders",data.recentOrders,"sales_order_id",["order_number","status"])+'</div>';
   bindCommon();
  }).catch(e=>{$("#content").innerHTML='<div class="error">'+esc(e.message)+'</div>';});
 }
 function defaultTable(key){return (tableGroups[key]||[])[0]?.[1]||"Farms";}
 function loadModule(key){
  const m=title(key),tabs=tableGroups[key]||[];if(!tabs.length){$("#content").innerHTML='<div class="empty"><strong>Module unavailable</strong></div>';return;}
  if(!tabs.some(x=>x[1]===state.table))state.table=defaultTable(key);
  renderModuleFrame(m,tabs);
  fetchRows();
 }
 function renderModuleFrame(m,tabs){
  $("#content").innerHTML='<section class="module-intro"><div><div class="crumb">FARMERP / '+esc(m.group.toUpperCase())+'</div><h2>'+esc(m.label)+'</h2><p>'+esc(m.desc)+'</p></div><span class="symbol">'+m.icon+'</span></section><div class="tabs">'+tabs.map(x=>'<button class="tab '+(state.table===x[1]?"active":"")+'" data-table="'+esc(x[1])+'">'+esc(x[0])+'</button>').join("")+'</div><div class="toolbar"><div class="search"><span>⌕</span><input id="record-search" placeholder="'+t("search")+'" value="'+esc(state.search)+'"></div><div class="toolbar-right"><button class="btn secondary" id="export-btn">↓ '+t("export")+'</button><button class="btn primary" id="new-btn">＋ '+t("new")+'</button></div></div><article class="panel data-panel"><div class="panel-head"><div><h3 id="table-title">'+esc(tabs.find(x=>x[1]===state.table)[0])+'</h3><p id="record-count">Loading records…</p></div><span class="tag">'+(ledgerTables.has(state.table)?"Append-only transaction":"Managed records")+'</span></div><div class="table-wrap" id="table-wrap"></div><div class="mobile-records" id="mobile-records"></div><div class="table-foot"><span id="page-info"></span><div><button class="btn ghost" id="prev-page">Previous</button><button class="btn ghost" id="next-page">Next</button></div></div></article>';
  $("#content").querySelectorAll("[data-table]").forEach(b=>b.onclick=()=>{state.table=b.dataset.table;state.offset=0;state.search="";loadModule(state.view);});
  $("#record-search").onkeydown=e=>{if(e.key==="Enter"){state.search=e.target.value;state.offset=0;fetchRows();}};
  $("#new-btn").onclick=()=>openRecord(state.table,null);
  $("#export-btn").onclick=exportCsv;
  $("#prev-page").onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);fetchRows();};
  $("#next-page").onclick=()=>{if(state.offset+state.limit<state.total){state.offset+=state.limit;fetchRows();}};
 }
 function displayColumns(table){
  const headers=state.schema.tables[table]||[];
  const key=state.schema.keys[table];
  const technical=new Set([key,"created_at","updated_at","created_by","recorded_by","assigned_by","reviewed_by","uploaded_by","actor_user_id","idempotency_key","permissions_json","checklist_json","assumptions_json","coverage_json","parts_json","resource_rates_json","harvest_profile_json"]);
  return headers.filter(h=>!technical.has(h)).slice(0,7);
 }
 function fetchRows(){
  const farmField=(state.schema.tables[state.table]||[]).includes("farm_id");
  const options={limit:state.limit,offset:state.offset,search:state.search,sortBy:"created_at",sortDir:"desc"};
  if(farmField&&state.farmId)options.farmId=state.farmId;
  $("#record-count").textContent=t("loading");
  call("erpList",state.table,options).then(data=>{state.rows=data.rows||[];state.total=data.total||0;renderRows();})
   .catch(e=>{$("#table-wrap").innerHTML='<div class="error">'+esc(e.message)+'</div>';});
 }
 function labelField(k){if(labelMap[k])return labelMap[k];return k.replace(/_id$/,"").replace(/_/g," ").replace(/w/g,c=>c.toUpperCase());}
 function statusClass(v){const s=String(v||"").toLowerCase().replace(/\s/g,"-");return ["active","completed","received"].includes(s)?"active":["blocked","overdue","action-required"].includes(s)?"blocked":["planned","pending","assigned"].includes(s)?"planned":"";}
 function renderRows(){
  const cols=displayColumns(state.table),key=state.schema.keys[state.table];
  $("#record-count").textContent=state.total+" records";
  $("#page-info").textContent=state.total?("Showing "+(state.offset+1)+"–"+Math.min(state.offset+state.rows.length,state.total)+" of "+state.total):"0 records";
  $("#prev-page").disabled=state.offset===0;$("#next-page").disabled=state.offset+state.limit>=state.total;
  if(!state.rows.length){const empty='<div class="empty"><div class="empty-icon">▦</div><strong>'+t("empty")+'</strong><span>'+t("emptyHint")+'</span></div>';$("#table-wrap").innerHTML=empty;$("#mobile-records").innerHTML=empty;return;}
  $("#table-wrap").innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+esc(labelField(c))+'</th>').join("")+'<th>Actions</th></tr></thead><tbody>'+state.rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c==="status"?'<span class="status '+statusClass(r[c])+'">'+esc(r[c])+'</span>':esc(r[c]))+'</td>').join("")+'<td><div class="row-actions"><button class="mini-btn" data-edit="'+esc(r[key])+'">Edit</button><button class="mini-btn" data-archive="'+esc(r[key])+'">Archive</button></div></td></tr>').join("")+'</tbody></table>';
  $("#mobile-records").innerHTML=state.rows.map(r=>'<article class="record-card"><div class="record-card-top"><strong>'+esc(r[cols[0]]||r[key])+'</strong><span class="status '+statusClass(r.status)+'">'+esc(r.status||"")+'</span></div><dl>'+cols.slice(1,5).map(c=>'<div><dt>'+esc(labelField(c))+'</dt><dd>'+esc(r[c])+'</dd></div>').join("")+'</dl><div class="record-card-actions"><button class="mini-btn" data-edit="'+esc(r[key])+'">Edit</button><button class="mini-btn" data-archive="'+esc(r[key])+'">Archive</button></div></article>').join("");
  $("#content").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openRecord(state.table,state.rows.find(r=>String(r[key])===b.dataset.edit)));
  $("#content").querySelectorAll("[data-archive]").forEach(b=>b.onclick=()=>archiveRecord(b.dataset.archive));
 }
 const fieldTables=new Set(["Organizations","Users","Roles","UserRoles","Teams","TeamMembers","Sites","Fields","Plots","Beds","Infrastructure","Units","Crops","Varieties","CropProfiles","PlantingCampaigns","PlantingPlans","CropCycles","CropCycleEvents","TaskTemplates","Tasks","TaskAssignments","People","Suppliers","InventoryItems","ProcurementOrders","ProcurementLines","StockLots","FarmMadeBatches","FarmMadeBatchInputs","HarvestSessions","ProduceLots","PackhouseOperations","Customers","Products","PriceLists","PriceListLines","SalesOrders","SalesOrderLines","Fulfilments","FulfilmentLines","Dispatches","Invoices","SalesReturns","SalesReturnLines","PaymentAccounts","CostAllocations","Assets","AssetUsage","Maintenance","CalendarEvents","EventParticipants","ActivityJournal","Attachments","DemandRecords","ForecastVersions","SavedViews"]);
 function inferType(h){
  const x=h.toLowerCase();
  if(["all_day","is_system_role"].includes(x))return "checkbox";
  if(x.endsWith("_date")||x==="date"||x==="start_date"||x==="end_date"||x==="valid_from"||x==="valid_to"||x==="joining_date"||x==="received_date"||x==="expiry_date")return "date";
  if(x.endsWith("_at")||x==="start_at"||x==="end_at")return "datetime-local";
  if(x.endsWith("_time")||x==="check_in"||x==="check_out")return "time";
  if(/quantity|amount|cost|price|rate|area|duration|minutes|hours|volume|percent|spacing|days|count|balance|threshold|factor|plant_count|survival|germination|discount|tax|subtotal|total|yield|meter|downtime|contribution|offset|interval|width|length|height/.test(x))return "number";
  if(/notes|description|address|method|reason|checklist|json|skills|basis|weather|recommendation|terms|message/.test(x))return "textarea";
  if(x==="status")return "status";
  if(x==="priority")return "priority";
  if(x==="severity")return "severity";
  if(x==="quick_status")return "quick_status";
  if(x.endsWith("_id")&&lookupMap[x])return "lookup";
  if(["production_system","propagation_method","employment_type","person_type","customer_type","event_type","entry_type","transaction_type","payment_method","cost_class","disposition","grade","application_type","movement_type","attendance_status","wage_basis","recurrence_type","demand_type","confidence","crop_category","item_category","asset_category","maintenance_type","unit","currency_code","preferred_language","default_language","country_code","area_unit","status"].includes(x))return "text";
  return "text";
 }
 const enums={status:["active","inactive","planned","ready","assigned","in_progress","blocked","partially_completed","completed","deferred","cancelled","draft","pending","approved","received","closed"],priority:["low","normal","high","urgent"],severity:["low","moderate","high","severe"],quick_status:["normal","monitor","action_required"]};
 async function lookupOptions(table){
  if(state.lookups[table])return state.lookups[table];
  const r=await call("erpList",table,{limit:500});state.lookups[table]=r.rows||[];return state.lookups[table];
 }
 async function openRecord(table,row){
  const key=state.schema.keys[table],headers=state.schema.tables[table]||[];
  if(!key){toast("This record type is read-only.",true);return;}
  const isLedger=ledgerTables.has(table);
  if(row&&isLedger){toast("Posted transactions are corrected by reversal or adjustment, not edited.",true);return;}
  const modal=document.createElement("dialog");modal.innerHTML='<form class="dialog-body" id="entry-form"><div class="dialog-head"><div><p>FARMERP / '+esc(table.toUpperCase())+'</p><h2>'+(row?"Edit ":"Create ")+esc(table.replace(/([A-Z])/g," $1").trim())+'</h2></div><button type="button" class="icon-btn" id="modal-close">×</button></div><div class="form-grid" id="dynamic-fields"><div class="loading">Preparing form…</div></div><div class="dialog-actions"><button type="button" class="btn secondary" id="cancel-entry">'+t("cancel")+'</button><button type="submit" class="btn primary" id="save-entry">'+t("save")+'</button></div></form>';
  document.body.append(modal);modal.showModal();
  const close=()=>modal.close();$("#modal-close",modal).onclick=close;$("#cancel-entry",modal).onclick=close;modal.addEventListener("close",()=>modal.remove());
  const required=new Set(state.schema.required[table]||[]),technical=new Set([key,"created_at","updated_at","created_by","recorded_by","assigned_by","reviewed_by","uploaded_by","actor_user_id","idempotency_key","pin_hash"]);
  const fields=headers.filter(h=>!technical.has(h));
  const lookups={};for(const h of fields){const typ=inferType(h);if(typ==="lookup"){const lt=lookupMap[h];try{lookups[h]=await lookupOptions(lt);}catch(e){lookups[h]=[];}}}
  const html=fields.map(h=>{
   const typ=inferType(h),val=row?row[h]??"": "",req=required.has(h),label=labelField(h);
   let input="";
   if(typ==="lookup"){
    const lt=lookupMap[h],opts=lookups[h]||[],lk=state.schema.keys[lt];
    input='<select name="'+esc(h)+'"><option value="">Select '+esc(label.toLowerCase())+'</option>'+opts.map(o=>'<option value="'+esc(o[lk])+'" '+(String(o[lk])===String(val)?"selected":"")+'>'+esc(o.farm_name||o.field_name||o.plot_name||o.crop_name||o.variety_name||o.display_name||o.customer_name||o.supplier_name||o.item_name||o.product_name||o.asset_name||o.title||o.name||o[lk])+'</option>').join("")+'</select>';
   } else if(typ==="checkbox") input='<input type="checkbox" name="'+esc(h)+'" '+(val===true||val==="TRUE"?"checked":"")+' style="width:18px;min-height:18px">';
   else if(typ==="textarea")input='<textarea name="'+esc(h)+'" placeholder="'+esc(label)+'">'+esc(val)+'</textarea>';
   else if(typ==="status"||typ==="priority"||typ==="severity"||typ==="quick_status")input='<select name="'+esc(h)+'"><option value="">Select…</option>'+(enums[typ]||[]).map(x=>'<option value="'+x+'" '+(String(val)===x?"selected":"")+'>'+x.replace(/_/g," ")+'</option>').join("")+'</select>';
   else input='<input name="'+esc(h)+'" type="'+(typ==="number"?"number":typ)+'" '+(typ==="number"?'step="any"':"")+' value="'+esc(val)+'" placeholder="'+esc(label)+'">';
   return '<div class="field '+(typ==="textarea"?"full":"")+'"><label>'+esc(label)+(req?' *':"")+'</label>'+input+'</div>';
  }).join("");
  $("#dynamic-fields",modal).innerHTML=html;
  $("#entry-form",modal).onsubmit=async e=>{
   e.preventDefault();const btn=$("#save-entry",modal);btn.disabled=true;btn.textContent="Saving…";
   const record={};new FormData(e.target).forEach((v,k)=>record[k]=v);
   fields.forEach(h=>{const el=e.target.elements.namedItem(h);if(el&&el.type==="checkbox")record[h]=el.checked;});
   try{
    if(isLedger){const idem=table+":"+((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+"-"+Math.random());await call("erpPostLedger",table,record,idem);}
    else{if(row)record[key]=row[key];await call("erpSave",table,record);}
    close();toast("Record saved successfully.");state.lookups={};fetchRows();if(state.view==="dashboard")loadDashboard();
   }catch(err){toast(err.message,true);btn.disabled=false;btn.textContent=t("save");}
  };
 }
 async function archiveRecord(id){
  if(!confirm("Archive this record? It will remain available in historical records."))return;
  try{await call("erpArchive",state.table,id,"Archived from FarmERP");toast("Record archived.");fetchRows();}catch(e){toast(e.message,true);}
 }
 async function exportCsv(){
  try{const csv=await call("erpCsv",state.table);const blob=new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=state.table+".csv";a.click();URL.revokeObjectURL(url);toast("CSV export prepared.");}catch(e){toast(e.message,true);}
 }
 function bindCommon(){$("#content").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));}
 init();
})();
</script>
</body>

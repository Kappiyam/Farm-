    const modal=document.createElement("dialog");
    modal.innerHTML='<form class="dialog-body" id="fulfil-form"><div class="dialog-head"><div><p>SALES / ORDER FULFILMENT</p><h2>Fulfil order</h2><p>Order '+esc(order.order_number||orderId)+' · '+esc(order.status)+'</p></div><button type="button" class="icon-btn" id="fulfil-close">×</button></div><div id="fulfil-lines" class="form-grid"></div><div class="dialog-actions"><button type="button" class="btn secondary" id="fulfil-cancel">Cancel</button><button type="submit" class="btn primary" id="fulfil-save">Save fulfilment</button></div></form>';

    }).join("");
    const fulfilmentReference="FUL-"+orderId+"-"+((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+"-"+Math.random());
    $("#fulfil-form",modal).onsubmit=async e=>{
      e.preventDefault();const btn=$("#fulfil-save",modal);btn.disabled=true;btn.textContent="Saving fulfilment…";

      if(!fulfilLines.length||fulfilLines.some(x=>!x.produce_lot_id)){toast("Select a produce lot and enter a quantity for each line.",true);btn.disabled=false;btn.textContent="Save fulfilment";return;}

    };

 function calYmd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
 function calDate(value){const a=String(value||"").slice(0,10).split("-").map(Number);return a.length===3?new Date(a[0],a[1]-1,a[2]):new Date();}
 function calendarRange(){
  const d=new Date(state.calendarDate),start=new Date(d),end=new Date(d);
  if(state.calendarView==="week"){start.setDate(start.getDate()-((start.getDay()+6)%7));end.setTime(start.getTime());end.setDate(end.getDate()+6);}
  else if(state.calendarView==="month"){start.setDate(1);end.setMonth(end.getMonth()+1,0);}
  else if(state.calendarView==="year"){start.setMonth(0,1);end.setMonth(11,31);}
  else if(state.calendarView==="agenda"){end.setDate(end.getDate()+30);}
  return {start:calYmd(start),end:calYmd(end)};
 }

  $("#content").innerHTML='<section class="module-intro"><div><div class="crumb">FARMERP / OVERVIEW</div><h2>Calendar & activity journal</h2><p>Events are scheduled occasions. Operational tasks are separate work records, and event creation does not assign work.</p></div><span class="symbol">▣</span></section><div class="calendar-toolbar"><div class="calendar-nav"><button class="btn secondary" id="cal-prev">‹</button><button class="btn secondary" id="cal-today">Today</button><button class="btn secondary" id="cal-next">›</button><strong id="cal-period"></strong></div><div class="calendar-actions"><select id="cal-view"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option><option value="agenda">Agenda / List</option></select><button class="btn primary" id="cal-new">＋ New event</button></div></div><section class="panel calendar-panel"><div id="calendar-render"><div class="loading">Loading calendar…</div></div></section><section class="panel journal-panel"><div class="panel-head"><div><h3>Activity journal</h3><p>Contextual notes and observations for this period</p></div><button class="btn secondary" id="journal-new">＋ Add journal entry</button></div><div id="journal-list"><div class="loading">Loading journal…</div></div></section>';
  $("#cal-view").value=state.calendarView;
  $("#cal-prev").onclick=()=>shiftCalendar(-1);$("#cal-next").onclick=()=>shiftCalendar(1);
  $("#cal-today").onclick=()=>{state.calendarDate=new Date();loadCalendarEvents();};
  $("#cal-view").onchange=e=>{state.calendarView=e.target.value;loadCalendarEvents();};
  $("#cal-new").onclick=()=>openCalendarEventForm(null,null);
  $("#journal-new").onclick=()=>openRecord("ActivityJournal",null);
  loadCalendarEvents();
 }
 function shiftCalendar(direction){
  const d=new Date(state.calendarDate);
  if(state.calendarView==="day")d.setDate(d.getDate()+direction);
  else if(state.calendarView==="week")d.setDate(d.getDate()+7*direction);
  else if(state.calendarView==="month")d.setMonth(d.getMonth()+direction,1);
  else if(state.calendarView==="year")d.setFullYear(d.getFullYear()+direction);
  else d.setDate(d.getDate()+30*direction);
  state.calendarDate=d;loadCalendarEvents();
 }
 async function loadCalendarEvents(){
  const range=calendarRange();$("#cal-period").textContent=range.start+" — "+range.end;
  $("#calendar-render").innerHTML='<div class="loading">Loading scheduled events…</div>';
  try{
   const result=await call("erpGetCalendarRange",state.farmId,range.start,range.end);
   state.calendarEvents=result.events||[];renderCalendarEvents();
   const journal=await call("erpList","ActivityJournal",{limit:500});
   const entries=(journal.rows||[]).filter(r=>(!state.farmId||String(r.farm_id)===String(state.farmId))&&String(r.occurred_at||"").slice(0,10)>=range.start&&String(r.occurred_at||"").slice(0,10)<=range.end);
   $("#journal-list").innerHTML=entries.length?entries.slice(0,30).map(r=>'<div class="journal-entry"><span class="journal-dot"></span><div><strong>'+esc(r.title||r.category||"Activity")+'</strong><p>'+esc(r.description||"")+'</p><small>'+esc(r.occurred_at||"")+' · '+esc(r.author_id||"")+'</small></div></div>').join(""):'<div class="empty"><strong>No journal entries in this period</strong><span>Add contextual notes separately from calendar events and tasks.</span></div>';
  }catch(e){$("#calendar-render").innerHTML='<div class="error">'+esc(e.message)+'</div>';}
 }
 function eventCard(e){
  const start=String(e.occurrence_start||"").replace("T"," "),end=String(e.occurrence_end||"").slice(11,16);
  const detail=[e.event_type,e.site_id,e.field_id,e.recurrence_type&&e.recurrence_type!=="none"?"Recurring "+e.recurrence_type:"",e.status==="cancelled"?"Cancelled":""].filter(Boolean).join(" · ");
  return '<article class="calendar-event '+(e.status==="cancelled"?"cancelled":"")+'"><div class="calendar-event-time">'+esc(start.slice(11,16)||"All day")+(end?" – "+esc(end):"")+'</div><div class="calendar-event-main"><strong>'+esc(e.title)+'</strong><small>'+esc(detail)+'</small></div><div class="calendar-event-actions"><button class="mini-btn" data-event="'+esc(e.event_id)+'" data-occurrence="'+esc(e.occurrence_start)+'">Open</button></div></article>';
 }
 function renderCalendarEvents(){
  const events=state.calendarEvents||[],view=state.calendarView;
  if(view==="month"){
   const base=new Date(state.calendarDate),first=new Date(base.getFullYear(),base.getMonth(),1),start=new Date(first);
   start.setDate(first.getDate()-((first.getDay()+6)%7));
   const cells=[];
   for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const key=calYmd(d),inMonth=d.getMonth()===base.getMonth();
    const dayEvents=events.filter(e=>String(e.occurrence_start).slice(0,10)===key);
    cells.push('<div class="month-cell '+(inMonth?"":"outside-month")+'"><span class="month-day">'+d.getDate()+'</span>'+dayEvents.slice(0,3).map(e=>'<button class="event-chip '+(e.status==="cancelled"?"cancelled":"")+'" data-event="'+esc(e.event_id)+'" data-occurrence="'+esc(e.occurrence_start)+'">'+esc(e.title)+'</button>').join("")+(dayEvents.length>3?'<small>+'+(dayEvents.length-3)+' more</small>':"")+'</div>');
   }
   $("#calendar-render").innerHTML='<div class="month-grid"><div class="month-weekday">Mon</div><div class="month-weekday">Tue</div><div class="month-weekday">Wed</div><div class="month-weekday">Thu</div><div class="month-weekday">Fri</div><div class="month-weekday">Sat</div><div class="month-weekday">Sun</div>'+cells.join("")+'</div>';
  }else if(view==="year"){
   const year=new Date(state.calendarDate).getFullYear();
   $("#calendar-render").innerHTML='<div class="year-grid">'+Array.from({length:12},(_,m)=>{
    const first=new Date(year,m,1),offset=(first.getDay()+6)%7,days=new Date(year,m+1,0).getDate();
    const nums=Array.from({length:offset},()=>'<span></span>').concat(Array.from({length:days},(_,d)=>{
     const day=d+1,key=calYmd(new Date(year,m,day)),count=events.filter(e=>String(e.occurrence_start).slice(0,10)===key).length;
     return '<button class="year-day '+(count?"has-event":"")+'" data-year-day="'+key+'">'+day+(count?'<i>'+count+'</i>':"")+'</button>';
    })).join("");
    return '<div class="year-month"><strong>'+new Date(year,m,1).toLocaleString(undefined,{month:"long"})+'</strong><div class="year-dates">'+nums+'</div></div>';
   }).join("")+'</div>';
  }else{
   const groups={};events.forEach(e=>{const key=String(e.occurrence_start).slice(0,10);if(!groups[key])groups[key]=[];groups[key].push(e);});
   const keys=Object.keys(groups).sort();
   $("#calendar-render").innerHTML=keys.length?'<div class="agenda-list">'+keys.map(key=>'<section class="agenda-day"><div class="agenda-date"><strong>'+esc(calDate(key).toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short"}))+'</strong><small>'+groups[key].length+' event(s)</small></div><div class="agenda-items">'+groups[key].map(eventCard).join("")+'</div></section>').join("")+'</div>':'<div class="empty"><div class="empty-icon">▣</div><strong>No calendar events in this period</strong><span>Schedule inspections, buyer visits, reviews, training and other important occasions here.</span></div>';
  }
  $("#calendar-render").querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>showCalendarEvent(b.dataset.event,b.dataset.occurrence));
  $("#calendar-render").querySelectorAll("[data-year-day]").forEach(b=>b.onclick=()=>{state.calendarDate=calDate(b.dataset.yearDay);state.calendarView="day";$("#cal-view").value="day";loadCalendarEvents();});
 }
 async function showCalendarEvent(eventId,occurrenceStart){
  const event=state.calendarEvents.find(e=>String(e.event_id)===String(eventId)&&String(e.occurrence_start)===String(occurrenceStart))||state.calendarEvents.find(e=>String(e.event_id)===String(eventId));
  if(!event)return;
  const dlg=document.createElement("dialog");
  dlg.innerHTML='<div class="dialog-body"><div class="dialog-head"><div><p>CALENDAR EVENT</p><h2>'+esc(event.title)+'</h2><p>'+esc(event.occurrence_start)+' '+esc(event.occurrence_end||"")+'</p></div><button class="icon-btn" id="event-close">×</button></div><div class="notice">'+esc(event.description||"No description")+'</div><p class="calendar-detail">'+esc([event.event_type,event.site_id,event.field_id,event.status].filter(Boolean).join(" · "))+'</p><div class="dialog-actions"><button class="btn secondary" id="event-task">Create task</button><button class="btn secondary" id="event-edit">Edit</button><button class="btn danger" id="event-cancel">Cancel occurrence</button></div></div>';
  document.body.append(dlg);dlg.showModal();const close=()=>dlg.close();$("#event-close",dlg).onclick=close;dlg.addEventListener("close",()=>dlg.remove());
  $("#event-task",dlg).onclick=()=>{close();openTaskFromEvent(event);};
  $("#event-edit",dlg).onclick=()=>{close();openCalendarEventForm(event,occurrenceStart);};
  $("#event-cancel",dlg).onclick=async()=>{if(!confirm("Cancel only this occurrence?"))return;try{await call("erpCancelCalendarOccurrence",eventId,occurrenceStart,"Cancelled by user");close();toast("Event occurrence cancelled.");loadCalendarEvents();}catch(e){toast(e.message,true);}};
 }
 function localDateTime(value){
  if(!value)return"";
  const d=new Date(value);if(isNaN(d.getTime()))return String(value).slice(0,16);
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
 }
 async function openCalendarEventForm(event,occurrenceStart){
  const master=event?(await call("erpList","CalendarEvents",{limit:1000,filter:{event_id:event.event_id}})).rows[0]:null;
  if(event&&!master){toast("Calendar series record not found.",true);return;}
  const farms=state.bootstrap.farms||[],farmOptions=farms.map(f=>'<option value="'+esc(f.farm_id)+'">'+esc(f.farm_name)+'</option>').join("");
  const isEdit=!!event,recurring=master&&["daily","weekly","monthly","yearly","custom"].includes(String(master.recurrence_type||"").toLowerCase());
  const startValue=event?event.occurrence_start:localDateTime(new Date());
  const endValue=event?event.occurrence_end:(master&&master.end_at||"");
  const dlg=document.createElement("dialog");
  dlg.innerHTML='<form class="dialog-body" id="calendar-event-form"><div class="dialog-head"><div><p>CALENDAR / '+(isEdit?"EDIT EVENT":"NEW EVENT")+'</p><h2>'+(isEdit?"Update scheduled event":"Create calendar event")+'</h2><p>Event creation never assigns work automatically.</p></div><button type="button" class="icon-btn" id="ce-close">×</button></div><div class="form-grid"><div class="field"><label>Farm *</label><select name="farm_id" required '+(isEdit?"disabled":"")+'><option value="">Select farm</option>'+farmOptions+'</select></div><div class="field"><label>Event title *</label><input name="title" required value="'+esc(master&&master.title||"")+'"></div><div class="field"><label>Type</label><input name="event_type" value="'+esc(master&&master.event_type||"inspection")+'"></div><div class="field"><label>Start *</label><input name="start_at" type="datetime-local" required value="'+esc(localDateTime(startValue))+'"></div><div class="field"><label>End</label><input name="end_at" type="datetime-local" value="'+esc(localDateTime(endValue))+'"></div><div class="field"><label>Recurrence</label><select name="recurrence_type"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="custom">Custom interval</option></select></div><div class="field"><label>Interval</label><input name="recurrence_interval" type="number" min="1" step="1" value="'+esc(master&&master.recurrence_interval||1)+'"></div><div class="field"><label>Series ends</label><input name="recurrence_end" type="date" value="'+esc(master&&master.recurrence_end||"")+'"></div><div class="field"><label>Occurrence limit</label><input name="occurrence_limit" type="number" min="1" step="1" value="'+esc(master&&master.occurrence_limit||"")+'"></div><div class="field full"><label>Description</label><textarea name="description">'+esc(master&&master.description||"")+'</textarea></div>'+(isEdit?'<div class="field full"><label>Apply changes to</label><select name="scope"><option value="single">Selected occurrence only</option><option value="future">This and following occurrences</option><option value="series">Entire series</option></select></div>':"")+'</div><div class="dialog-actions"><button type="button" class="btn secondary" id="ce-cancel">Cancel</button><button type="submit" class="btn primary" id="ce-save">Save event</button></div></form>';
  document.body.append(dlg);dlg.showModal();const close=()=>dlg.close();$("#ce-close",dlg).onclick=close;$("#ce-cancel",dlg).onclick=close;dlg.addEventListener("close",()=>dlg.remove());
  const form=$("#calendar-event-form",dlg);if(master)form.elements.farm_id.value=master.farm_id;else if(state.farmId)form.elements.farm_id.value=state.farmId;
  form.elements.recurrence_type.value=master&&master.recurrence_type||"none";
  form.onsubmit=async e=>{
   e.preventDefault();const btn=$("#ce-save",dlg);btn.disabled=true;btn.textContent="Saving…";
   const f=new FormData(form),data={};
   ["farm_id","title","event_type","start_at","end_at","recurrence_type","recurrence_interval","recurrence_end","occurrence_limit","description"].forEach(k=>data[k]=f.get(k)||"");
   data.all_day=false;data.status="active";
   try{
    if(!isEdit){data.created_by="";await call("erpSave","CalendarEvents",data);}
    else{
      delete data.farm_id;delete data.recurrence_type;delete data.recurrence_interval;delete data.recurrence_end;delete data.occurrence_limit;delete data.all_day;delete data.status;
      const scope=f.get("scope")||"single";
      await call("erpUpdateCalendarEvent",master.event_id,scope,occurrenceStart,data,"Updated in calendar");
    }
    close();toast("Calendar event saved.");loadCalendarEvents();
   }catch(err){toast(err.message,true);btn.disabled=false;btn.textContent="Save event";}
  };
 }
 async function openTaskFromEvent(event){
  const dlg=document.createElement("dialog");
  dlg.innerHTML='<form class="dialog-body" id="event-task-form"><div class="dialog-head"><div><p>CALENDAR / TASK LINK</p><h2>Create an operational task</h2><p>Assignment and execution remain separate.</p></div><button type="button" class="icon-btn" id="et-close">×</button></div><div class="form-grid"><div class="field full"><label>Task title *</label><input name="title" required value="'+esc(event.title)+'"></div><div class="field"><label>Due date</label><input type="date" name="due_at" value="'+esc(String(event.occurrence_start).slice(0,10))+'"></div></div><div class="dialog-actions"><button type="button" class="btn secondary" id="et-cancel">Cancel</button><button class="btn primary">Create task</button></div></form>';
  document.body.append(dlg);dlg.showModal();const close=()=>dlg.close();$("#et-close",dlg).onclick=close;$("#et-cancel",dlg).onclick=close;dlg.addEventListener("close",()=>dlg.remove());
  $("#event-task-form",dlg).onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call("erpCreateTaskFromCalendarEvent",event.event_id,event.occurrence_start,f.get("title"),f.get("due_at"));close();toast("Task created from event.");}catch(err){toast(err.message,true);}};
 }
 const fieldTables=new Set(["Organizations","Users","Roles","UserRoles","Teams","TeamMembers","Sites","Fields","Plots","Beds","Infrastructure","Units","Crops","Varieties","CropProfiles","PlantingCampaigns","PlantingPlans","CropCycles","CropCycleEvents","TaskTemplates","Tasks","TaskAssignments","People","Suppliers","InventoryItems","ProcurementOrders","ProcurementLines","StockLots","FarmMadeBatches","FarmMadeBatchInputs","HarvestSessions","ProduceLots","PackhouseOperations","Customers","Products","PriceLists","PriceListLines","SalesOrders","SalesOrderLines","Fulfilments","FulfilmentLines","Dispatches","Invoices","SalesReturns","SalesReturnLines","PaymentAccounts","CostAllocations","Assets","AssetUsage","Maintenance","CalendarEvents","EventParticipants","ActivityJournal","Attachments","DemandRecords","ForecastVersions","SavedViews"]);
 function inferType(h){
  const x=h.toLowerCase();
  if(["all_day","is_system_role"].includes(x))return "checkbox";
  if(x.endsWith("_date")||x==="date"||x==="start_date"||x==="end_date"||x==="valid_from"||x==="valid_to"||x==="joining_date"||x==="received_date"||x==="expiry_date")return "date";
  if(x.endsWith("_at")||x==="start_at"||x==="end_at")return "datetime-local";
  if(x.endsWith("_time")||x==="check_in"||x==="check_out")return "time";
  if(/quantity|amount|cost|price|rate|area|duration|minutes|hours|volume|percent|spacing|days|count|balance|threshold|factor|plant_count|survival|germination|discount|tax|subtotal|total|yield|meter|downtime|contribution|offset|interval|width|length|height/.test(x))return "number";
  if(/notes|description|address|method|reason|checklist|json|skills|basis|weather|recommendation|terms|message/.test(x))return "textarea";
  if(x==="status")return "status";
  if(x==="priority")return "priority";
  if(x==="severity")return "severity";
  if(x==="quick_status")return "quick_status";
  if(x.endsWith("_id")&&lookupMap[x])return "lookup";
  if(["production_system","propagation_method","employment_type","person_type","customer_type","event_type","entry_type","transaction_type","payment_method","cost_class","disposition","grade","application_type","movement_type","attendance_status","wage_basis","recurrence_type","demand_type","confidence","crop_category","item_category","asset_category","maintenance_type","unit","currency_code","preferred_language","default_language","country_code","area_unit","status"].includes(x))return "text";
  return "text";
 }
 const enums={status:["active","inactive","planned","ready","assigned","in_progress","blocked","partially_completed","completed","deferred","cancelled","draft","pending","approved","received","closed"],priority:["low","normal","high","urgent"],severity:["low","moderate","high","severe"],quick_status:["normal","monitor","action_required"]};
 async function lookupOptions(table){
  if(state.lookups[table])return state.lookups[table];
  const r=await call("erpList",table,{limit:500});state.lookups[table]=r.rows||[];return state.lookups[table];
 }
 async function openRecord(table,row){
  const key=state.schema.keys[table],headers=state.schema.tables[table]||[];
  if(!key||workflowManagedTables.has(table)){toast("This record type is managed by a workflow and is read-only here.",true);return;}
  const isLedger=ledgerTables.has(table);
  if(row&&isLedger){toast("Posted transactions are corrected by reversal or adjustment, not edited.",true);return;}
  const modal=document.createElement("dialog");modal.innerHTML='<form class="dialog-body" id="entry-form"><div class="dialog-head"><div><p>FARMERP / '+esc(table.toUpperCase())+'</p><h2>'+(row?"Edit ":"Create ")+esc(table.replace(/([A-Z])/g," $1").trim())+'</h2></div><button type="button" class="icon-btn" id="modal-close">×</button></div><div class="form-grid" id="dynamic-fields"><div class="loading">Preparing form…</div></div><div class="dialog-actions"><button type="button" class="btn secondary" id="cancel-entry">'+t("cancel")+'</button><button type="submit" class="btn primary" id="save-entry">'+t("save")+'</button></div></form>';
  document.body.append(modal);modal.showModal();
  const close=()=>modal.close();$("#modal-close",modal).onclick=close;$("#cancel-entry",modal).onclick=close;modal.addEventListener("close",()=>modal.remove());
  const required=new Set(state.schema.required[table]||[]),technical=new Set([key,"created_at","updated_at","created_by","recorded_by","assigned_by","reviewed_by","uploaded_by","actor_user_id","idempotency_key","pin_hash"]);
  const fields=headers.filter(h=>!technical.has(h)&&!(hiddenCalculatedFields[table]||[]).includes(h));
  const lookups={};for(const h of fields){const typ=inferType(h);if(typ==="lookup"){const lt=lookupMap[h];try{lookups[h]=await lookupOptions(lt);}catch(e){lookups[h]=[];}}}
  const html=fields.map(h=>{
   const typ=inferType(h),val=row?row[h]??"": "",req=required.has(h),label=labelField(h);
   let input="";
   if(typ==="lookup"){
    const lt=lookupMap[h],opts=lookups[h]||[],lk=state.schema.keys[lt];
    input='<select name="'+esc(h)+'"><option value="">Select '+esc(label.toLowerCase())+'</option>'+opts.map(o=>'<option value="'+esc(o[lk])+'" '+(String(o[lk])===String(val)?"selected":"")+'>'+esc(o.farm_name||o.field_name||o.plot_name||o.crop_name||o.variety_name||o.display_name||o.customer_name||o.supplier_name||o.item_name||o.product_name||o.asset_name||o.title||o.name||o[lk])+'</option>').join("")+'</select>';
   } else if(typ==="checkbox") input='<input type="checkbox" name="'+esc(h)+'" '+(val===true||val==="TRUE"?"checked":"")+' style="width:18px;min-height:18px">';
   else if(typ==="textarea")input='<textarea name="'+esc(h)+'" placeholder="'+esc(label)+'">'+esc(val)+'</textarea>';
   else if(typ==="status"||typ==="priority"||typ==="severity"||typ==="quick_status")input='<select name="'+esc(h)+'"><option value="">Select…</option>'+(enums[typ]||[]).map(x=>'<option value="'+x+'" '+(String(val)===x?"selected":"")+'>'+x.replace(/_/g," ")+'</option>').join("")+'</select>';
   else input='<input name="'+esc(h)+'" type="'+(typ==="number"?"number":typ)+'" '+(typ==="number"?'step="any"':"")+' value="'+esc(val)+'" placeholder="'+esc(label)+'">';
   return '<div class="field '+(typ==="textarea"?"full":"")+'"><label>'+esc(label)+(req?' *':"")+'</label>'+input+'</div>';
  }).join("");
  $("#dynamic-fields",modal).innerHTML=html;
  $("#entry-form",modal).onsubmit=async e=>{
   e.preventDefault();const btn=$("#save-entry",modal);btn.disabled=true;btn.textContent="Saving…";
   const record={};new FormData(e.target).forEach((v,k)=>record[k]=v);
   fields.forEach(h=>{const el=e.target.elements.namedItem(h);if(el&&el.type==="checkbox")record[h]=el.checked;});
   try{
    if(isLedger){const idem=table+":"+((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+"-"+Math.random());await call("erpPostLedger",table,record,idem);}
    else{if(row)record[key]=row[key];await call("erpSave",table,record);}
    close();toast("Record saved successfully.");state.lookups={};fetchRows();if(state.view==="dashboard")loadDashboard();
   }catch(err){toast(err.message,true);btn.disabled=false;btn.textContent=t("save");}
  };
 }
 async function archiveRecord(id){
  if(!confirm("Archive this record? It will remain available in historical records."))return;
  try{await call("erpArchive",state.table,id,"Archived from FarmERP");toast("Record archived.");fetchRows();}catch(e){toast(e.message,true);}
 }
 async function exportCsv(){
  try{const csv=await call("erpCsv",state.table);const blob=new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=state.table+".csv";a.click();URL.revokeObjectURL(url);toast("CSV export prepared.");}catch(e){toast(e.message,true);}
 }
 function bindCommon(){$("#content").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));}
 init();

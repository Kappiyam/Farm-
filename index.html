<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C4A">
<title>Kappiyam Farm</title>
<style>
:root{
  --bg:#EDF1EA; --surface:#FAFBF8; --ink:#14261D; --muted:#5C6C62; --line:#D3DBD0;
  --primary:#1F5C4A; --on-primary:#FFFFFF; --accent:#D9A21B;
  --warn-bg:#FBF1D8; --warn-ink:#6B4A00; --bad:#B3261E; --tint:#E2ECE3;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1914; --surface:#16231C; --ink:#E7F0E9; --muted:#9BAEA2; --line:#2B3B31;
    --primary:#6CC4A1; --on-primary:#0B1F17; --accent:#E8B93A;
    --warn-bg:#3A2F10; --warn-ink:#F3D98C; --bad:#F2A29B; --tint:#1E2F25;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--primary);color:var(--on-primary)}
.top b{display:block;font-size:1.05rem;letter-spacing:-.01em}
.top span{font-size:.82rem;opacity:.85}
.top button{background:transparent;border:1px solid currentColor;border-radius:10px;padding:8px 12px;min-height:40px;color:inherit}

.banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:.92rem}
.pad{padding:18px 16px}
.lead{margin:6px 0 18px;color:var(--muted)}

.field{margin:0 0 16px}
.field>label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.hint:empty{display:none}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit}
textarea{resize:vertical}
.row{display:flex;gap:8px}
.row input{flex:1}
.row select{flex:0 0 7.5rem;width:7.5rem}

.btn{min-height:46px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.6;cursor:default}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:600;text-decoration:underline}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}

.warn{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:.92rem}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.search{margin-bottom:6px}

.list{margin:0;padding:0;list-style:none}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.item:last-child{border-bottom:0}
.item .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .t{font-weight:700}
.item .id{font-size:.85rem;color:var(--muted)}
.item .l3{margin-top:6px;font-size:.92rem;color:var(--muted)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

.rail{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.rail i{width:20px;height:6px;border-radius:3px;background:var(--line)}
.rail i.on{background:var(--primary)}
.rail i.now{background:var(--accent)}
.rail.done i{background:var(--muted);opacity:.5}
.stage{font-weight:600;font-size:.9rem}

dl{margin:12px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}
dd{margin:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:60px;
  background:none;border:0;color:var(--muted);font-size:.78rem}
.tabs button.on{color:var(--primary);font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .18s ease-out}
.sheet h3{margin-bottom:12px}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.login{padding:72px 24px 24px;max-width:420px;margin:0 auto}
.login h1{font-size:2rem;font-weight:800;color:var(--primary)}
.login p{color:var(--muted);margin:8px 0 28px}
.login .err{color:var(--bad);min-height:1.4em;margin:12px 0 0}
.login input{font-size:1.6rem;letter-spacing:.35em;text-align:center;margin-bottom:14px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;
  margin:0 auto;max-width:560px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
.sub{margin:20px 0 8px;font-weight:700}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ================================================================
   SETUP: paste your Apps Script Web app URL between the quotes below
   ================================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxPjTgLmDIZtpNTs7vi1X0wDG5uoqdG7XSsZP7zWexBc-31jkN39a1s2yO9pvdm91gJYQ/exec';

const STAGES = ['planned', 'sown', 'growing', 'harvesting', 'closed'];
const STAGE_LABEL = { planned: 'Planned', sown: 'Sown', growing: 'Growing', harvesting: 'Harvesting', closed: 'Closed' };
const SETTING_LABEL = {
  farm_name: 'Farm name',
  lease_per_acre_per_year: 'Lease per acre per year (Rs)',
  paid_day_hours: 'Hours in a paid day',
  wage_male_per_day: 'Daily wage, men (Rs)',
  wage_female_per_day: 'Daily wage, women (Rs)',
  rotation_gap_days: 'Rotation gap (days)',
  misc_cost_split: 'Common costs are shared'
};

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = {
  token: store.get('kf_token'), user: store.get('kf_user'), data: store.get('kf_data'),
  tab: 'batches', filter: 'open', q: '', offline: false, areaUnit: store.get('kf_unit') || 'acres'
};

const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (s, n) => new Date(Date.parse(s + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmtNum = n => Number(n).toLocaleString('en-IN', { maximumFractionDigits: 1 });
const round = (n, d) => Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
const isActive = r => String(r.active).toLowerCase() !== 'no';
const toAcres = (v, unit) => { const n = parseFloat(v); return isNaN(n) ? NaN : (unit === 'cents' ? n / 100 : n); };
const fromAcres = (a, unit) => unit === 'cents' ? a * 100 : a;

function areaText(acres) {
  if (acres === '' || acres == null || isNaN(Number(acres))) return 'area not set';
  const c = Math.round(Number(acres) * 100);
  if (c < 100) return c + ' cents';
  const a = Math.floor(c / 100), r = c % 100;
  return r ? a + ' ac ' + r + ' cents' : a + ' ac';
}

const cropBy = code => S.data.crops.find(c => c.crop_code === code);
const plotBy = id => S.data.plots.find(p => p.plot_id === id);
const varietiesFor = code => S.data.varieties.filter(v => v.crop_code === code && isActive(v));
const openCount = id => S.data.batches.filter(b => b.plot_id === id && b.status !== 'closed').length;
const opts = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const field = (label, inner, hint) => `<div class="field"><label>${label}</label>${inner}${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
const unitOpts = cur => opts([['acres', 'acres'], ['cents', 'cents']], cur);

let toastTimer;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (kind === 'bad' ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3200);
}

/* ---------- server calls ---------- */
async function api(action, payload) {
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  } catch (e) {
    const err = new Error('No connection. Check your internet and try again.'); err.code = 'NET'; throw err;
  }
  let j;
  try { j = await res.json(); } catch (e) { const err = new Error('The server gave an unexpected reply.'); err.code = 'NET'; throw err; }
  if (!j.ok) { const err = new Error(j.error || 'Something went wrong'); err.code = j.code || ''; throw err; }
  return j;
}

function cacheData() { store.set('kf_data', S.data); }

async function loadData() {
  const j = await api('bootstrap');
  S.data = j.data; S.user = j.data.user; S.offline = false;
  store.set('kf_user', S.user); cacheData();
}

function needOnline() {
  if (S.offline) { toast('You are offline. Connect to save changes.', 'bad'); return false; }
  return true;
}

async function guard(btn, fn) {
  if (!needOnline()) return;
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try { await fn(); }
  catch (e) {
    if (e.code === 'AUTH') return logout(e.message);
    toast(e.message, 'bad');
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}

function logout(msg) {
  S.token = null; S.user = null; S.data = null;
  store.del('kf_token'); store.del('kf_user'); store.del('kf_data');
  closeModal(); showLogin(typeof msg === 'string' ? msg : '');
}

/* ---------- sign in ---------- */
function showLogin(msg) {
  $('#app').innerHTML = `<main class="login">
    <h1>Kappiyam Farm</h1>
    <p>Farm records, batch by batch.</p>
    <form id="lf">
      <label for="pin" class="sub" style="display:block;margin-top:0">Enter your PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p class="err" id="lerr">${esc(msg || '')}</p>
    </form></main>`;
  $('#lf').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#lf button');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const j = await api('login', { pin: $('#pin').value });
      S.token = j.token; S.user = j.user;
      store.set('kf_token', S.token); store.set('kf_user', S.user);
      await loadData();
      S.tab = 'batches'; render();
    } catch (e) {
      const el = $('#lerr'); if (el) el.textContent = e.message;
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
}

/* ---------- shell ---------- */
const ICONS = {
  batches: '<path d="M5 6h14M5 12h14M5 18h9"/>',
  sow: '<path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/>',
  plots: '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
  crops: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l7-7"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const TABS = [['batches', 'Batches'], ['sow', 'Sow plan'], ['plots', 'Plots'], ['crops', 'Crops'], ['settings', 'Settings']];

function render() {
  if (!S.token || !S.data) return showLogin();
  const owner = S.user && S.user.role === 'owner';
  const farm = esc(S.data.settings.farm_name || 'Kappiyam Farm');
  const view = owner ? VIEWS[S.tab]() : noScreen();
  $('#app').innerHTML = `
    <header class="top"><div><b>${farm}</b><span>${esc(S.user.name)}</span></div>
      <button data-act="refresh" aria-label="Refresh data">Refresh</button></header>
    ${S.offline ? '<div class="banner">You are offline. Showing saved data. Saving is paused until you reconnect.</div>' : ''}
    <main id="view">${view}</main>
    ${owner ? `<nav class="tabs" aria-label="Main"><div>${TABS.map(([k, l]) =>
      `<button data-act="tab" data-tab="${k}" class="${S.tab === k ? 'on' : ''}"${S.tab === k ? ' aria-current="page"' : ''}>
        <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join('')}</div></nav>` : ''}`;
  if (owner && S.tab === 'sow') bindSow();
}

function noScreen() {
  return `<section class="pad"><h2>Welcome, ${esc(S.user.name)}</h2>
    <p class="lead">Your screen for ${esc(S.user.role)} work is being built and arrives in a later session. For now, the owner enters the data.</p>
    <button class="btn wide" data-act="signout">Sign out</button></section>`;
}

/* ---------- modal ---------- */
function modal(html) {
  closeModal();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'ov';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal() { const o = $('#ov'); if (o) o.remove(); }

/* ================================================================
   BATCHES
   ================================================================ */
function rail(st) {
  const i = STAGES.indexOf(st);
  return `<span class="rail${st === 'closed' ? ' done' : ''}" aria-hidden="true">${STAGES.map((s, k) => `<i class="${k < i ? 'on' : k === i ? 'now' : ''}"></i>`).join('')}</span>`;
}

function batchRows() {
  const q = S.q.trim().toLowerCase();
  const list = S.data.batches.filter(b => {
    if (S.filter === 'open' && b.status === 'closed') return false;
    if (S.filter === 'closed' && b.status !== 'closed') return false;
    return !q || (b.batch_id + ' ' + b.crop + ' ' + b.variety + ' ' + b.plot_id).toLowerCase().includes(q);
  }).sort((a, b) => String(b.sow_date).localeCompare(String(a.sow_date)));
  if (!list.length) {
    return `<p class="empty">${S.data.batches.length ? 'No batches match.' : 'No batches yet. Start with the Sow plan tab.'}</p>`;
  }
  return `<ul class="list">${list.map(b => {
    const p = plotBy(b.plot_id);
    return `<li><button class="item" data-act="openBatch" data-id="${esc(b.batch_id)}">
      <div class="l1"><span class="t">${esc(b.crop)}${b.variety ? ', ' + esc(b.variety) : ''}</span><span class="id num">${esc(b.batch_id)}</span></div>
      <div class="l3">${esc(p ? p.name : b.plot_id)}, ${areaText(b.area_acres)}</div>
      <div class="l3">${rail(b.status)}<span class="stage">${STAGE_LABEL[b.status] || esc(b.status)}</span>${b.expected_first_harvest && b.status !== 'closed' ? ', first harvest ' + fmtDate(b.expected_first_harvest) : ''}</div>
    </button></li>`;
  }).join('')}</ul>`;
}

function viewBatches() {
  const all = S.data.batches, nOpen = all.filter(b => b.status !== 'closed').length;
  const chip = (k, l, n) => `<button class="chip${S.filter === k ? ' on' : ''}" data-act="filter" data-f="${k}">${l} (${n})</button>`;
  return `<section class="pad"><h2>Batches</h2>
    <p class="lead">Every cost, harvest and sale will attach to a batch.</p>
    <div class="chips">${chip('open', 'Open', nOpen)}${chip('closed', 'Closed', all.length - nOpen)}${chip('all', 'All', all.length)}</div>
    <input class="search" id="q" type="search" placeholder="Search crop, plot or batch ID" value="${esc(S.q)}" aria-label="Search batches">
    <div id="blist">${batchRows()}</div></section>`;
}

function openBatch(id) {
  const b = S.data.batches.find(x => x.batch_id === id); if (!b) return;
  const p = plotBy(b.plot_id);
  modal(`<h3>${esc(b.crop)}${b.variety ? ', ' + esc(b.variety) : ''}</h3>
    <p class="muted num" style="margin:-6px 0 8px">${esc(b.batch_id)}</p>
    <div>${rail(b.status)}<span class="stage">${STAGE_LABEL[b.status]}</span></div>
    <dl>
      <dt>Plot</dt><dd>${esc(p ? p.name : b.plot_id)}</dd>
      <dt>Area</dt><dd>${areaText(b.area_acres)}</dd>
      <dt>Sowing date</dt><dd>${fmtDate(b.sow_date)}</dd>
      <dt>First harvest</dt><dd>${fmtDate(b.expected_first_harvest)}</dd>
      <dt>Expected yield</dt><dd>${b.expected_total_kg === '' ? 'not set' : fmtNum(b.expected_total_kg) + ' kg (' + fmtNum(b.expected_yield_kg_per_acre) + ' kg per acre)'}</dd>
      ${b.closed_date ? `<dt>Closed on</dt><dd>${fmtDate(b.closed_date)}</dd>` : ''}
      <dt>Entered by</dt><dd>${esc(b.created_by)}, ${fmtDate(b.created_at)}</dd>
    </dl>
    <div class="sub">Change stage</div>
    <div class="row"><select id="m_stage" aria-label="Stage">${opts(STAGES.map(s => [s, STAGE_LABEL[s]]), b.status)}</select>
      <input id="m_date" type="date" value="${today()}" aria-label="Date"></div>
    <p class="hint">The date is used when you choose Sown (sowing date) or Closed (closing date).</p>
    <button class="btn primary wide" data-act="setStage" data-id="${esc(b.batch_id)}" style="margin-top:10px">Update stage</button>
    <div class="sub">Notes</div>
    ${field('Target orders', `<input id="m_orders" value="${esc(b.target_orders)}">`)}
    ${field('Notes', `<textarea id="m_notes" rows="3">${esc(b.notes)}</textarea>`)}
    <div class="actions"><button class="btn" data-act="closeModal">Close</button>
      <button class="btn primary" data-act="saveNotes" data-id="${esc(b.batch_id)}">Save notes</button></div>`);
}

/* ================================================================
   SOWING PLAN
   ================================================================ */
let F = null, warnKey = '', warnList = [], warnTimer = null;
const newForm = () => ({ crop: '', variety: '', target: '', yield: '', area: '', unit: S.areaUnit, plot: '', date: today(), status: 'planned', orders: '', notes: '' });

function varietyOptions() {
  if (!F.crop) return '<option value="">Choose a crop first</option>';
  return opts([['', 'Not specified']].concat(varietiesFor(F.crop).map(v => [v.variety, v.variety])), F.variety);
}

function viewSow() {
  if (!F) F = newForm();
  const crops = S.data.crops.filter(isActive), plots = S.data.plots.filter(isActive);
  return `<section class="pad"><h2>Sowing plan</h2>
    <p class="lead">One batch is one crop and variety on one plot. Plan it here.</p>
    ${field('Crop', `<select id="f_crop"><option value="">Choose a crop</option>${opts(crops.map(c => [c.crop_code, c.crop]), F.crop)}</select>`)}
    ${field('Variety', `<select id="f_variety">${varietyOptions()}</select>`)}
    ${field('Quantity needed for orders (kg)', `<input id="f_target" type="number" inputmode="decimal" min="0" step="any" value="${esc(F.target)}">`, 'Optional. Used to suggest the area.')}
    ${field('Expected yield (kg per acre)', `<input id="f_yield" type="number" inputmode="decimal" min="0" step="any" value="${esc(F.yield)}">`, '<span id="h_yield"></span>')}
    ${field('Area of this batch', `<div class="row"><input id="f_area" type="number" inputmode="decimal" min="0" step="any" value="${esc(F.area)}"><select id="f_unit" aria-label="Area unit">${unitOpts(F.unit)}</select></div>`, '<span id="h_area"></span>')}
    ${field('Plot', `<select id="f_plot"><option value="">Choose a plot</option>${opts(plots.map(p => [p.plot_id, p.name + ' (' + p.plot_id + ')']), F.plot)}</select>`, '<span id="h_plot"></span>')}
    ${field('Sowing date', `<input id="f_date" type="date" value="${esc(F.date)}">`, '<span id="h_harvest"></span>')}
    ${field('Status', `<select id="f_status">${opts([['planned', 'Planned, not sown yet'], ['sown', 'Already sown']], F.status)}</select>`)}
    ${field('Target orders', `<input id="f_orders" type="text" placeholder="Example: Kitchen 300 kg, Export 200 kg" value="${esc(F.orders)}">`)}
    ${field('Notes', `<textarea id="f_notes" rows="2">${esc(F.notes)}</textarea>`)}
    <div id="f_warn"></div>
    <button class="btn primary wide" data-act="saveBatch">Save batch</button></section>`;
}

function bindSow() {
  const bind = (id, key) => { const el = $('#' + id); el.oninput = el.onchange = e => { F[key] = e.target.value; hints(); }; };
  $('#f_crop').onchange = e => {
    F.crop = e.target.value; F.variety = '';
    const c = cropBy(F.crop);
    F.yield = c && c.expected_yield_kg_per_acre !== '' ? String(c.expected_yield_kg_per_acre) : '';
    $('#f_yield').value = F.yield;
    $('#f_variety').innerHTML = varietyOptions();
    hints();
  };
  bind('f_variety', 'variety'); bind('f_target', 'target'); bind('f_yield', 'yield'); bind('f_area', 'area');
  bind('f_plot', 'plot'); bind('f_date', 'date'); bind('f_status', 'status'); bind('f_orders', 'orders'); bind('f_notes', 'notes');
  $('#f_unit').onchange = e => {
    const a = toAcres(F.area, F.unit);
    F.unit = e.target.value; S.areaUnit = F.unit; store.set('kf_unit', F.unit);
    if (F.area !== '' && !isNaN(a)) { F.area = String(round(fromAcres(a, F.unit), 3)); $('#f_area').value = F.area; }
    hints();
  };
  hints();
}

function hints() {
  const c = cropBy(F.crop), y = num(F.yield), t = num(F.target), area = toAcres(F.area, F.unit);
  $('#h_yield').textContent = c && !(y > 0) ? 'Add the expected yield to get an area suggestion and an expected total. You can also set it once on the Crops tab.' : '';
  let h = '';
  if (t > 0 && y > 0) {
    const need = t / y;
    h = `For ${fmtNum(t)} kg at ${fmtNum(y)} kg per acre you need about ${areaText(need)}. <button class="link" type="button" data-act="useArea" data-v="${need}">Use this area</button>`;
  } else if (area > 0 && y > 0) {
    h = `Expected total: ${fmtNum(area * y)} kg.`;
  }
  $('#h_area').innerHTML = h;

  const p = plotBy(F.plot);
  $('#h_plot').textContent = p ? `${areaText(p.area_acres)}, ${openCount(p.plot_id)} open batch${openCount(p.plot_id) === 1 ? '' : 'es'}.` : '';

  let hv = '';
  if (c && F.date) {
    const d = num(c.days_to_first_harvest);
    hv = d > 0 ? 'Expected first harvest: ' + fmtDate(addDays(F.date, d)) + '.' : 'Set days to first harvest on the Crops tab to see the expected harvest date.';
  }
  $('#h_harvest').textContent = hv;

  const key = [F.plot, F.crop, F.date].join('|');
  if (key !== warnKey) {
    warnKey = key; warnList = []; clearTimeout(warnTimer);
    if (F.plot && F.crop && !S.offline) {
      warnTimer = setTimeout(async () => {
        try {
          const j = await api('checkPlot', { plot_id: F.plot, crop_code: F.crop, sow_date: F.date });
          if (warnKey === key) { warnList = j.result.warnings; showWarn(); }
        } catch (e) { /* the save step checks again */ }
      }, 400);
    }
  }
  showWarn();
}

function showWarn() {
  const el = $('#f_warn'); if (!el) return;
  const list = warnList.slice(), p = plotBy(F.plot), area = toAcres(F.area, F.unit);
  if (p && p.area_acres !== '' && area > Number(p.area_acres) + 0.0001) {
    list.push(`This batch (${areaText(area)}) is larger than the plot (${areaText(p.area_acres)}).`);
  }
  el.innerHTML = list.map(w => `<p class="warn">${esc(w)}</p>`).join('');
}

/* ================================================================
   PLOTS
   ================================================================ */
function viewPlots() {
  const rows = S.data.plots.slice().sort((a, b) => a.plot_id.localeCompare(b.plot_id, undefined, { numeric: true }));
  const missing = rows.filter(p => isActive(p) && p.area_acres === '').length;
  return `<section class="pad"><h2>Plots</h2>
    <p class="lead">${missing ? `${missing} plot${missing === 1 ? ' needs' : 's need'} an area. Tap a plot to set it.` : 'Tap a plot to edit it.'}</p>
    <button class="btn wide" data-act="newPlot">Add a plot</button>
    <ul class="list" style="margin-top:8px">${rows.map(p => `<li><button class="item" data-act="openPlot" data-id="${esc(p.plot_id)}">
      <div class="l1"><span class="t">${esc(p.name)}</span><span class="id num">${esc(p.plot_id)}</span></div>
      <div class="l3">${areaText(p.area_acres)}, ${esc(p.tenure)}${isActive(p) ? '' : ', not in use'}${openCount(p.plot_id) ? ', ' + openCount(p.plot_id) + ' open batch' + (openCount(p.plot_id) === 1 ? '' : 'es') : ''}</div>
    </button></li>`).join('')}</ul></section>`;
}

function openPlot(id) {
  const isNew = !id;
  const p = isNew ? { plot_id: '', name: '', area_acres: '', tenure: 'lease', soil_notes: '', active: 'yes' } : plotBy(id);
  if (!p) return;
  const unit = S.areaUnit;
  const aval = p.area_acres === '' ? '' : round(fromAcres(Number(p.area_acres), unit), 3);
  modal(`<h3>${isNew ? 'Add a plot' : esc(p.name)}</h3>
    ${field('Plot number', `<input id="p_id" value="${esc(p.plot_id)}" ${isNew ? 'placeholder="Example: P31"' : 'readonly'}>`)}
    ${field('Name', `<input id="p_name" value="${esc(p.name)}">`)}
    ${field('Area', `<div class="row"><input id="p_area" type="number" inputmode="decimal" min="0" step="any" value="${aval}"><select id="p_unit" aria-label="Area unit">${unitOpts(unit)}</select></div>`)}
    ${field('Tenure', `<select id="p_tenure">${opts([['lease', 'Lease'], ['owned', 'Owned']], p.tenure)}</select>`)}
    ${field('Soil notes', `<textarea id="p_soil" rows="2">${esc(p.soil_notes)}</textarea>`)}
    ${isNew ? '' : field('Status', `<select id="p_active">${opts([['yes', 'In use'], ['no', 'Not in use']], p.active)}</select>`)}
    <div class="actions"><button class="btn" data-act="closeModal">Cancel</button>
      <button class="btn primary" data-act="savePlot" data-new="${isNew ? '1' : ''}">Save plot</button></div>`);
  $('#p_unit').onchange = e => {
    const a = toAcres($('#p_area').value, S.areaUnit);
    S.areaUnit = e.target.value; store.set('kf_unit', S.areaUnit);
    if (!isNaN(a)) $('#p_area').value = round(fromAcres(a, S.areaUnit), 3);
  };
}

/* ================================================================
   CROPS
   ================================================================ */
function viewCrops() {
  const rows = S.data.crops.slice().sort((a, b) => a.crop.localeCompare(b.crop));
  return `<section class="pad"><h2>Crops</h2>
    <p class="lead">Days to first harvest and expected yield power the sowing plan. Fill them in once per crop.</p>
    <button class="btn wide" data-act="newCrop">Add a crop</button>
    <ul class="list" style="margin-top:8px">${rows.map(c => {
      const need = c.days_to_first_harvest === '' || c.expected_yield_kg_per_acre === '';
      return `<li><button class="item" data-act="openCrop" data-id="${esc(c.crop_code)}">
        <div class="l1"><span class="t">${esc(c.crop)}</span><span class="id num">${esc(c.crop_code)}</span></div>
        <div class="l3">${esc(c.family)}${c.perennial === 'yes' ? ', perennial' : ''}${isActive(c) ? '' : ', not in use'}</div>
        <div class="l3">${need ? 'Needs days to first harvest and expected yield' : c.days_to_first_harvest + ' days, ' + fmtNum(c.expected_yield_kg_per_acre) + ' kg per acre'}</div>
      </button></li>`;
    }).join('')}</ul></section>`;
}

function openCrop(code) {
  const isNew = !code;
  const c = isNew ? { crop_code: '', crop: '', family: '', perennial: 'no', days_to_first_harvest: '', expected_yield_kg_per_acre: '', active: 'yes' } : cropBy(code);
  if (!c) return;
  const families = Array.from(new Set(S.data.crops.map(x => x.family).filter(Boolean)));
  const vars = isNew ? '' : `<div class="sub">Varieties</div>
    ${varietiesFor(c.crop_code).map(v => `<div class="vrow"><span>${esc(v.variety)}</span><button class="link" data-act="delVariety" data-code="${esc(c.crop_code)}" data-v="${esc(v.variety)}">Remove</button></div>`).join('') || '<p class="hint">No varieties yet.</p>'}
    <div class="row" style="margin-top:10px"><input id="v_new" placeholder="New variety name" aria-label="New variety"><button class="btn" style="flex:0 0 auto" data-act="addVariety" data-code="${esc(c.crop_code)}">Add</button></div>`;
  modal(`<h3>${isNew ? 'Add a crop' : esc(c.crop)}</h3>
    ${field('Crop code', `<input id="c_code" value="${esc(c.crop_code)}" ${isNew ? 'placeholder="3 letters, example: OKR" maxlength="4"' : 'readonly'}>`, isNew ? 'Used in batch IDs.' : '')}
    ${field('Crop name', `<input id="c_name" value="${esc(c.crop)}">`)}
    ${field('Crop family', `<input id="c_family" list="fam" value="${esc(c.family)}"><datalist id="fam">${families.map(f => `<option value="${esc(f)}">`).join('')}</datalist>`, 'Used for rotation warnings.')}
    ${field('Type', `<select id="c_peren">${opts([['no', 'Seasonal, replanted each cycle'], ['yes', 'Perennial, stays for years']], c.perennial)}</select>`)}
    ${field('Days to first harvest', `<input id="c_days" type="number" inputmode="numeric" min="0" step="1" value="${esc(c.days_to_first_harvest)}">`)}
    ${field('Expected yield (kg per acre)', `<input id="c_yield" type="number" inputmode="decimal" min="0" step="any" value="${esc(c.expected_yield_kg_per_acre)}">`)}
    ${isNew ? '' : field('Status', `<select id="c_active">${opts([['yes', 'In use'], ['no', 'Not in use']], c.active)}</select>`)}
    <div class="actions"><button class="btn" data-act="closeModal">Cancel</button>
      <button class="btn primary" data-act="saveCrop" data-new="${isNew ? '1' : ''}">Save crop</button></div>
    ${vars}`);
}

/* ================================================================
   SETTINGS
   ================================================================ */
function viewSettings() {
  const s = S.data.settings;
  const inputFor = k => k === 'misc_cost_split'
    ? `<select data-set="${k}">${opts([['equal', 'Equally across batches'], ['area_days', 'By area and days on the plot']], s[k])}</select>`
    : `<input data-set="${k}" ${k === 'farm_name' ? 'type="text"' : 'type="number" inputmode="decimal" min="0" step="any"'} value="${esc(s[k])}">`;
  return `<section class="pad"><h2>Settings</h2>
    <p class="lead">These rates feed the cost reports in later sessions.</p>
    ${Object.keys(SETTING_LABEL).filter(k => k in s).map(k => field(SETTING_LABEL[k], inputFor(k))).join('')}
    <button class="btn primary wide" data-act="saveSettings">Save settings</button>
    <div class="sub">Account</div>
    <p class="muted">Signed in as ${esc(S.user.name)}, ${esc(S.user.role)}. PINs and people are managed in the Users tab of the Google Sheet.</p>
    <div class="actions"><button class="btn" data-act="refresh">Refresh data</button><button class="btn danger" data-act="signout">Sign out</button></div>
    </section>`;
}

const VIEWS = { batches: viewBatches, sow: viewSow, plots: viewPlots, crops: viewCrops, settings: viewSettings };

/* ================================================================
   ACTIONS
   ================================================================ */
function applyData(j) { S.data = j.data; cacheData(); }
const val = id => { const el = $('#' + id); return el ? el.value : ''; };

const ACT = {
  tab(t) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); },
  filter(t) { S.filter = t.dataset.f; render(); },
  signout() { logout(''); },
  closeModal,
  async refresh(t) {
    try { await loadData(); render(); toast('Data refreshed'); }
    catch (e) {
      if (e.code === 'AUTH') return logout(e.message);
      S.offline = true; render(); toast(e.message, 'bad');
    }
  },
  openBatch(t) { openBatch(t.dataset.id); },
  useArea(t) {
    const a = Number(t.dataset.v);
    F.area = String(round(fromAcres(a, F.unit), 3)); $('#f_area').value = F.area; hints();
  },
  async setStage(t) {
    const id = t.dataset.id, st = val('m_stage'), d = val('m_date');
    await guard(t, async () => {
      const j = await api('setBatchStatus', { batch_id: id, status: st, sow_date: d, closed_date: d });
      applyData(j); closeModal(); render(); toast(id + ' is now ' + STAGE_LABEL[st].toLowerCase());
    });
  },
  async saveNotes(t) {
    const id = t.dataset.id;
    await guard(t, async () => {
      const j = await api('updateBatch', { batch_id: id, notes: val('m_notes'), target_orders: val('m_orders') });
      applyData(j); closeModal(); render(); toast('Notes saved');
    });
  },
  async saveBatch(t) {
    if (!F.crop) return toast('Choose a crop', 'bad');
    if (!F.plot) return toast('Choose a plot', 'bad');
    const area = toAcres(F.area, F.unit);
    if (!(area > 0)) return toast('Enter the area of the batch', 'bad');
    await guard(t, async () => {
      const chk = await api('checkPlot', { plot_id: F.plot, crop_code: F.crop, sow_date: F.date });
      if (chk.result.warnings.length && !confirm(chk.result.warnings.join('\n\n') + '\n\nSave this batch anyway?')) return;
      const j = await api('createBatch', {
        crop_code: F.crop, variety: F.variety, plot_id: F.plot, area_acres: area, sow_date: F.date, status: F.status,
        expected_yield_kg_per_acre: F.yield, target_orders: F.orders, notes: F.notes
      });
      applyData(j); toast('Batch ' + j.result.batch_id + ' saved');
      F = null; warnKey = ''; warnList = []; S.tab = 'batches'; S.filter = 'open'; render();
    });
  },
  newPlot() { openPlot(null); },
  openPlot(t) { openPlot(t.dataset.id); },
  async savePlot(t) {
    const isNew = !!t.dataset.new;
    const area = $('#p_area').value === '' ? '' : toAcres($('#p_area').value, val('p_unit'));
    const row = { plot_id: val('p_id'), name: val('p_name'), area_acres: area === '' ? '' : round(area, 4), tenure: val('p_tenure'), soil_notes: val('p_soil') };
    if (!isNew) row.active = val('p_active');
    if (!row.plot_id.trim()) return toast('Enter a plot number', 'bad');
    if (isNew && plotBy(row.plot_id.trim().toUpperCase().replace(/\s+/g, ''))) return toast('That plot number already exists', 'bad');
    await guard(t, async () => {
      const j = await api('saveRow', { sheet: 'Plots', row });
      applyData(j); closeModal(); render(); toast('Plot saved');
    });
  },
  newCrop() { openCrop(null); },
  openCrop(t) { openCrop(t.dataset.id); },
  async saveCrop(t) {
    const isNew = !!t.dataset.new;
    const row = { crop_code: val('c_code'), crop: val('c_name'), family: val('c_family'), perennial: val('c_peren'),
      days_to_first_harvest: val('c_days'), expected_yield_kg_per_acre: val('c_yield') };
    if (!isNew) row.active = val('c_active');
    if (!row.crop_code.trim()) return toast('Enter a crop code', 'bad');
    if (!row.crop.trim()) return toast('Enter a crop name', 'bad');
    if (isNew && cropBy(row.crop_code.trim().toUpperCase().replace(/\s+/g, ''))) return toast('That crop code already exists', 'bad');
    await guard(t, async () => {
      const j = await api('saveRow', { sheet: 'Crops', row });
      applyData(j); closeModal(); render(); toast('Crop saved');
    });
  },
  async addVariety(t) {
    const code = t.dataset.code, name = val('v_new').trim();
    if (!name) return toast('Enter a variety name', 'bad');
    await guard(t, async () => {
      const j = await api('saveRow', { sheet: 'Varieties', row: { crop_code: code, variety: name, active: 'yes' } });
      applyData(j); openCrop(code); toast('Variety added');
    });
  },
  async delVariety(t) {
    const code = t.dataset.code, name = t.dataset.v;
    await guard(null, async () => {
      const j = await api('saveRow', { sheet: 'Varieties', row: { crop_code: code, variety: name, active: 'no' } });
      applyData(j); openCrop(code); toast('Variety removed');
    });
  },
  async saveSettings(t) {
    const inputs = Array.from(document.querySelectorAll('[data-set]'));
    await guard(t, async () => {
      let last = null;
      for (const el of inputs) {
        const k = el.dataset.set;
        if (String(S.data.settings[k]) === String(el.value)) continue;
        last = await api('saveRow', { sheet: 'Settings', row: { key: k, value: el.value } });
      }
      if (last) { applyData(last); render(); toast('Settings saved'); } else toast('Nothing changed');
    });
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !ACT[t.dataset.act]) return;
  ACT[t.dataset.act](t, e);
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.q = e.target.value;
    const box = $('#blist'); if (box) box.innerHTML = batchRows();
  }
});

/* ---------- start ---------- */
(async function start() {
  if (!API_URL || API_URL.indexOf('PASTE') === 0) {
    $('#app').innerHTML = '<main class="login"><h1>Almost ready</h1><p>Open index.html and set API_URL to your Apps Script Web app URL, then reload.</p></main>';
    return;
  }
  if (!S.token) return showLogin();
  try { await loadData(); }
  catch (e) {
    if (e.code === 'AUTH') return logout(e.message);
    if (S.data && S.user) S.offline = true;
    else return showLogin('Cannot reach the server. Check your connection.');
  }
  render();
})();
</script>
</body>
</html>
